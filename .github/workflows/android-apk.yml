# Builds the NIVASA resident app (Adda_App/) as a release APK signed with the upload keystore, then publishes it
# as a workflow artifact and as a GitHub Release asset.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64    base64 of the .jks file
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias (e.g. nivasa); if it doesn't match, a keystore with one key uses that key
#   ANDROID_KEY_PASSWORD       optional; ignored for PKCS12 keystores, which use the keystore password for the key
name: Android APK (NIVASA)

on:
  push:
    branches: [main]
    paths:
      - 'Adda_App/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # create the GitHub Release that carries the APK

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Adda_App
    env:
      EXPO_PUBLIC_API_URL: https://adda.skillinnovex.in
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      # ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD are resolved and exported by the "Restore signing keystore" step.
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Adda_App/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SECRET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v"; exit 1; fi
          done
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/nivasa-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$ANDROID_KEYSTORE_PATH" >> "$GITHUB_ENV"
          # Tolerate CR/LF/spaces that Windows clipboards add to the pasted base64.
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 -d > "$ANDROID_KEYSTORE_PATH" 2> decode.err; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64 ($(cat decode.err)). Re-copy it with [Convert]::ToBase64String(...)."
            exit 1
          fi
          echo "Decoded keystore: $(stat -c %s "$ANDROID_KEYSTORE_PATH") bytes, header $(head -c 4 "$ANDROID_KEYSTORE_PATH" | od -An -tx1 | tr -d ' ')"
          # Fail here (not deep inside Gradle) with a clear reason if the password or alias is wrong.
          if ! keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" > store.txt 2>&1; then
            echo "::error::Cannot open the keystore with ANDROID_KEYSTORE_PASSWORD: $(grep -m1 -i 'error' store.txt)"
            exit 1
          fi
          # Resolve the key alias: the secret (trimmed, case-insensitive) if it names a key in the store; otherwise the
          # store's only key. Aliases are key names, not secrets.
          mapfile -t KEYS < <(grep 'PrivateKeyEntry' store.txt | cut -d, -f1)
          WANT=$(printf '%s' "$SECRET_KEY_ALIAS" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
          ALIAS=""
          for k in "${KEYS[@]}"; do [ "${k,,}" = "${WANT,,}" ] && ALIAS="$k"; done
          if [ -z "$ALIAS" ] && [ "${#KEYS[@]}" -eq 1 ]; then
            ALIAS="${KEYS[0]}"
            echo "::warning::ANDROID_KEY_ALIAS does not name a key in the keystore; using its only key '$ALIAS'. Set the secret to '$ALIAS' to silence this."
          fi
          if [ -z "$ALIAS" ]; then
            echo "::error::ANDROID_KEY_ALIAS does not match a key in the keystore. Keys found: ${KEYS[*]:-none}"
            exit 1
          fi
          # PKCS12 keystores (keytool's default, DER header 30 82) have one password for store and key.
          if [ "$(head -c 2 "$ANDROID_KEYSTORE_PATH" | od -An -tx1 | tr -d ' ')" = "3082" ]; then
            KEY_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
            [ -n "$SECRET_KEY_PASSWORD" ] && [ "$SECRET_KEY_PASSWORD" != "$ANDROID_KEYSTORE_PASSWORD" ] && \
              echo "::warning::PKCS12 keystore: ANDROID_KEY_PASSWORD differs from ANDROID_KEYSTORE_PASSWORD; using the keystore password for the key."
          else
            KEY_PASSWORD="${SECRET_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          fi
          {
            echo "ANDROID_KEY_ALIAS=$ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          rm -f store.txt decode.err
          echo "Keystore OK (key '$ALIAS')"

      - name: Install dependencies
        run: npm ci

      - name: Set version code
        # versionCode must increase with every APK that users install over an older one.
        run: |
          node -e "
            const fs = require('fs');
            const j = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            j.expo.android.versionCode = Number(process.env.GITHUB_RUN_NUMBER);
            fs.writeFileSync('app.json', JSON.stringify(j, null, 2));
            console.log('version', j.expo.version, 'versionCode', j.expo.android.versionCode, 'package', j.expo.android.package);
          "

      - name: Generate native Android project
        run: npx expo prebuild -p android --clean --no-install

      - name: Build release APK
        working-directory: Adda_App/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Verify package and signature
        id: verify
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:|application-label:" | tee badging.txt
          grep -q "name='com.nivasa.app'" badging.txt || { echo "::error::Unexpected package name"; exit 1; }
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee signature.txt
          if grep -q "CN=Android Debug" signature.txt; then echo "::error::APK is signed with the debug key"; exit 1; fi
          # The APK certificate must be the one inside our keystore.
          EXPECTED=$(keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | grep -m1 "SHA256:" | sed 's/.*SHA256: //; s/://g' | tr 'A-F' 'a-f')
          ACTUAL=$(grep -m1 "certificate SHA-256 digest" signature.txt | sed 's/.*digest: //')
          echo "expected $EXPECTED"; echo "actual   $ACTUAL"
          [ -n "$EXPECTED" ] && [ "$EXPECTED" = "$ACTUAL" ] || { echo "::error::APK certificate does not match the release keystore"; exit 1; }
          VERSION=$(node -p "require('./app.json').expo.version")
          NAME="NIVASA-v${VERSION}-build${GITHUB_RUN_NUMBER}.apk"
          mkdir -p dist-apk && cp "$APK" "dist-apk/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.verify.outputs.name }}
          path: Adda_App/dist-apk/${{ steps.verify.outputs.name }}
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="nivasa-v${{ steps.verify.outputs.version }}-build${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "dist-apk/${{ steps.verify.outputs.name }}" \
            --target "$GITHUB_SHA" \
            --title "NIVASA ${{ steps.verify.outputs.version }} (build ${GITHUB_RUN_NUMBER})" \
            --notes "Signed release APK for com.nivasa.app, built from ${GITHUB_SHA::7}. API: ${EXPO_PUBLIC_API_URL}."

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/nivasa-release.jks"
